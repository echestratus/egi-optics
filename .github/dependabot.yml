version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci(deps)"
    labels: [dependencies, ci]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      wordpress-tooling:
        patterns: ["@wordpress/*"]

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels: [dependencies]
    groups:
      php-tooling:
        patterns: ["squizlabs/*", "wp-coding-standards/*", "phpcompatibility/*", "dealerdirect/*", "php-parallel-lint/*", "php-stubs/*"]
      wordpress-plugins:
        patterns: ["wpackagist-plugin/*"]
